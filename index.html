<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pizza calculator & comparison</title>
    <link rel="shortcut icon" href="images/icons/one-piece.png">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/pizzacalc.css">

    <script src="scripts/pizzacalc.js" defer></script>
</head>

<body>
    <p id="title">🍕 Which pizza is the best choice?</p>
    <p id="info-panel">To add a new pizza hover over the + below and select its shape!</p>
        
    <div id="main">
        <div id="pizza-add">
            <div id="add-plus">
                <img src="images/icons/plus.png" alt="Add pizza">
            </div>

            <div id="add-circ-pizza" class="add-button" onclick="addPizza('c')">
                <img src="images/icons/c-pizza.png" alt="Circular pizza">
            </div>

            <div id="add-rect-pizza" class="add-button" onclick="addPizza('r')">
                <img src="images/icons/r-pizza.png" alt="Rectangular pizza">
            </div>

            <div id="add-pizza-slice" class="add-button" onclick="addPizza('s')">
                <img src="images/icons/s-pizza.png" alt="Slice of pizza">
            </div>
        </div>
    </div>
</body>
</html>
