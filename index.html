<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Just a fancy looking website where you can calculate the price of pizza per cm^2 and compare it with other pizzas to find out which ones have the best value for money!">
    <meta name="author" content="Michał Gajewski">

    <title>Pizza calculator & comparison</title>
    <link rel="shortcut icon" href="images/icons/slice.png">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/pizzacalc.css">
    <script src="scripts/main.js" defer></script>
    <script src="scripts/pizzacalc.js" defer></script>
</head>

<body>
    <button id="options__button" onclick="toggleOptions(); this.blur()">
        <img src="images/icons/options.png" alt="Options">
    </button>

    <div id="options" class="no-display">
        <button class="options__option" onclick="this.blur()">Add multiple same pizzas</button>
        <button class="options__option" onclick="this.blur(); setRandomValuesToAllPizzas()">Randomize values for all pizzas</button>
        <button class="options__option" onclick="this.blur(); if(confirm('Do you really want to delete all pizzas?')) deleteAllPizzas()">Delete all pizzas</button>
        <button class="options__option" onclick="this.blur()">Pizzas history</button>
        <button class="options__option" onclick="this.blur(); openCopyBox(exportPizzasToUrl())">Generate URL with all pizzas</button>
        <button class="options__option" onclick="this.blur(); openImportFromUrlBox()">Import pizzas from URL</button>
        <button class="options__option" onclick="this.blur(); openSetTitleBox()">Set title</button>
        <button class="options__option" onclick="this.blur(); window.open('https://github.com/HyVeel', '_blank')">GitHub</button>
    </div>

    <p id="title-bar">🍕 Which pizza is the best choice?</p>
    <p id="info-bar">To add a new pizza hover over the + below and select its shape!</p>

    <div id="main">
        <div tabindex="0" class="pizza-add">
            <div class="pizza-add__plus">
                <img src="images/plus.png" alt="Add pizza">
            </div>

            <button class="pizza-add__circular pizza-add__button" onclick="addPizza('c', '', 1); this.blur()">
                <img src="images/c-pizza.png" alt="Circular pizza">
            </button>

            <button class="pizza-add__rectangular pizza-add__button" onclick="addPizza('r', '', 1); this.blur()">
                <img src="images/r-pizza.png" alt="Rectangular pizza">
            </button>

            <button class="pizza-add__slice pizza-add__button" onclick="addPizza('s', '', 1); this.blur()">
                <img src="images/s-pizza.png" alt="Slice of pizza">
            </button>
        </div>
    </div>
</body>
</html>
